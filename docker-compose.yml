services:
  hellpot:
    build: .
    image: bdk38/hellpot-community:local
    container_name: hellpot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Named volumes need no host prep. On first start Docker seeds them from
      # the image (/config/config.toml and empty /logs).
      - hellpot-config:/config
      - hellpot-logs:/logs

      # Bind-mount alternative (edit config on the host as a normal file):
      # 1) mkdir -p config logs
      # 2) cp docker_config.toml config/config.toml
      # 3) replace the two lines above with:
      # - ./config:/config
      # - ./logs:/logs
      # If the container can't write logs, fix ownership once:
      #    sudo chown -R 65532:65532 config logs

volumes:
  hellpot-config:
  hellpot-logs:
